# Merge to main does not publish. A stable GitHub Release is the only trigger.
# n8n requires GitHub Actions plus npm provenance for verified community nodes.
#
# One-time npm trusted publisher: GitHub Actions, owner beehiiv, repo n8n,
# workflow filename publish.yml. Or set NPM_TOKEN as a repo secret.

name: Publish

on:
  release:
    types: [released]

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run n8n-node lint
        run: pnpm run lint

      - name: Build
        run: pnpm run build

      - name: Publish
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" >> .npmrc
          fi
          pnpm publish --provenance --access public --no-git-checks
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
